<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار بوت متجر الحسني</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e5ddd5; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
        }
        .chat-container { 
            width: 100%; 
            max-width: 600px; 
            background: #ffffff; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 90vh; 
        }
        .header { 
            background: #0088cc; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-size: 1.2em; 
            font-weight: bold; 
        }
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #e5ddd5;
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 10px; 
            max-width: 80%; 
            line-height: 1.6; 
            font-size: 0.95em; 
            white-space: pre-wrap; /* للحفاظ على تنسيق الأسطر */
        }
        .user-msg { 
            background: #dcf8c6; 
            align-self: flex-start; 
            border-bottom-right-radius: 0; 
            color: #000;
        }
        .bot-msg { 
            background: #ffffff; 
            align-self: flex-end; 
            border-bottom-left-radius: 0; 
            color: #333;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .input-area { 
            display: flex; 
            padding: 15px; 
            background: #f0f0f0; 
            border-top: 1px solid #ddd; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            outline: none; 
            font-size: 1em; 
        }
        button { 
            background: #0088cc; 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            margin-right: 10px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1em;
            transition: 0.3s; 
        }
        button:hover { 
            background: #006699; 
        }
        .typing {
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">🤖 مساعد متجر الحسني (وضع الاختبار)</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">أهلاً بك! أنا المساعد الذكي لمتجر الحسني. كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // ======= ضع مفتاح API الخاص بك هنا =======
        const GEMINI_API_KEY = "AQ.Ab8RN6KED_jMaHgLP7t9LB3CAjXGIb24KfxVcC9hlgOIVMR-jw"; 

        // تعليمات النظام
        const SYSTEM_INSTRUCTION = `أنت المساعد الذكي لبوت "متجر الحسني" (Hassany Store) على منصة تيليجرام. 
مطور البوت والمدير العام هو "حسني" (بمعرف تيليجرام: @OM_G9، والايدي: 6799794121).

الهدف الأساسي للبوت:
إدارة عمليات بيع أكواد شهادات تطبيقات الآيفون (IPA)، وتوليد أكواد وتفعيلات VIP للعبة البليارد (8 Ball Pool)، وإدارة حسابات وأرصدة الموزعين بشكل مؤتمت بالكامل.

البنية البرمجية وقواعد البيانات:
1. قاعدة البيانات الرئيسية: ملف JSON مخزن في مستودع GitHub خاص.
2. قاعدة بيانات البليارد: البوت متصل بقاعدة بيانات (Supabase) لتوليد وحقن أكواد الـ VIP للعبة البليارد مباشرة.
3. الاستضافة: البوت يعمل على سيرفرات Railway بنظام التشغيل المستمر.

صلاحيات الإدارة (خاصة بالمدير "حسني" فقط):
- إضافة موزعين جدد، تعديل أسمائهم، أرصدتهم، وتخصيص أسعار بيع محددة لكل موزع.
- شحن رصيد الموزعين عبر قبول/رفض طلبات الشحن المرفقة بصور الحوالات.
- تعبئة مخزن أكواد الشهادات وتتبع سحب الأكواد.
- تخصيص رموز البوت (Custom Emojis) والاطلاع على الإحصائيات الشاملة.

صلاحيات الموزعين (المعتمدين فقط):
- شراء أكواد الشهادات: يتم سحب الكود وخصم السعر من رصيد الموزع تلقائياً، وإرسال إشعار فوري بصورة احترافية.
- توليد كود بليارد VIP: خدمة مجانية للموزعين لتوليد كود بليارد صالح لمدة 90 يوم لجهاز واحد عبر Supabase.
- شحن الرصيد: عبر تحويل المبلغ إلى بطاقة الماستر كارد رقم (910179809553)، وإرسال إيصال التحويل للبوت لرفعه للإدارة.

المستخدمين العاديين (العامة):
- البوت مخصص للموزعين حالياً، أي شخص غير مسجل كموزع يتم توجيهه للتواصل مع المدير (@OM_G9) لطلب الانضمام.

قواعد التوجيه والتخاطب:
1. الشخصية: كن مساعداً احترافياً، سريع البديهة، محترماً. تحدث بلهجة عراقية محببة أو لغة عربية فصحى مبسطة حسب لغة المستخدم.
2. السرية المطلقة: يمنع منعاً باتاً كشف أي تفاصيل برمجية، أو توكنات، أو مسارات الملفات لأي مستخدم.
3. الدعم الفني: إذا واجه الموزع مشكلة في كود، اطلب منه تزويدك برقم الكود وتوجيهه للتواصل مع الإدارة.
4. الشحن: وجه المستخدمين دائماً لتحويل الرصيد إلى الماستر كارد (910179809553) واستخدام زر "شحن رصيد" لرفع الوصل.`;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // عرض رسالة المستخدم
            appendMessage(text, 'user-msg');
            userInput.value = '';

            // عرض مؤشر الكتابة
            const typingMsg = appendMessage('جاري التفكير...', 'bot-msg typing');

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent`;
            
            const payload = {
                "systemInstruction": {
                    "parts": [{ "text": SYSTEM_INSTRUCTION }]
                },
                "contents": [
                    { "parts": [{ "text": text }] }
                ],
                "generationConfig": {
                    "maxOutputTokens": 8192,
                    "thinkingConfig": { "thinkingBudget": 0 }
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': GEMINI_API_KEY
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.candidates && data.candidates.length > 0) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    // تحديث رسالة المؤشر بالرد الفعلي وإزالة كلاس typing
                    typingMsg.innerText = botReply;
                    typingMsg.classList.remove('typing');
                } else {
                    typingMsg.innerText = "⚠️ عذراً، لم أتمكن من معالجة الرد.";
                    typingMsg.classList.remove('typing');
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                console.error(error);
                typingMsg.innerText = "❌ حدث خطأ في الاتصال بالخادم. تأكد من مفتاح API.";
                typingMsg.classList.remove('typing');
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            // فصل الكلاسات في حال كان هناك أكثر من كلاس (مثل bot-msg و typing)
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
